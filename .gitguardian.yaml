# GitGuardian / ggshield configuration.
#
# The golden layout fixture is generated by programs/mitra-vault/tests/golden_layout.rs
# and holds only PUBLIC data: the program id, public keys built from constant test
# bytes ([0x11; 32], [0x22; 32], [0x33; 32], [0x44; 32]), the PDAs derived from them,
# instruction discriminators and account bytes. Its base58 PDAs read as high-entropy
# strings and were flagged as secrets — false positives, checked 2026-10-04. Real dev
# keys live in .dev-keys/, which is gitignored and has never been committed.
#
# Only this one file is ignored, so a real key added anywhere else is still caught.
version: 2
secret:
  ignored_paths:
    - programs/mitra-vault/tests/golden/vault-layout.json
